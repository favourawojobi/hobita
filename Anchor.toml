[toolchain]
anchor_version = "1.2.2"
solana_version = "4.4.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
hobita = "9eFuz8LMR8ED84Bm5ri4mxNrCfpjuWTrY9r9xpkHnDfJ"

[programs.devnet]
hobita = "9eFuz8LMR8ED84Bm5ri4mxNrCfpjuWTrY9r9xpkHnDfJ"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
