name: program

on:
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "tests/**"
      - "Anchor.toml"
      - "Cargo.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/program.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to devnet after a passing build"
        type: boolean
        default: true

concurrency:
  group: program-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Solana CLI 4.4.1
        run: |
          curl -sSfL "https://release.anza.xyz/v4.4.1/install" | sh -s
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Install Anchor 1.2.2
        run: |
          sudo curl -sSfL -o /usr/local/bin/anchor \
            "https://github.com/coral-xyz/anchor/releases/download/v1.2.2/anchor-1.2.2-x86_64-unknown-linux-gnu"
          sudo chmod +x /usr/local/bin/anchor
          anchor --version
          solana --version

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Sync program keypair
        run: |
          mkdir -p target/deploy
          cp keys/hobita-devnet.json target/deploy/hobita-keypair.json

      - name: Build program
        run: anchor build

      - name: Run tests on a local validator
        continue-on-error: true
        run: anchor test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hobita-program
          path: |
            target/deploy/hobita.so
            target/idl/hobita.json
          if-no-files-found: error

      - name: Deploy to devnet
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          SOLANA_DEVNET_KEYPAIR: ${{ secrets.SOLANA_DEVNET_KEYPAIR }}
        run: |
          if [ -z "$SOLANA_DEVNET_KEYPAIR" ]; then
            echo "::warning::SOLANA_DEVNET_KEYPAIR secret is missing; skipping deploy"
            exit 0
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/deployer.json"
          printf '%s' "$SOLANA_DEVNET_KEYPAIR" > "$RUNNER_TEMP/deployer.json"
          solana config set --url devnet --keypair "$RUNNER_TEMP/deployer.json"
          # Devnet deployer needs SOL for deploy + transaction fees.
          for attempt in 1 2 3; do
            solana airdrop 2 --url devnet && break || echo "airdrop attempt $attempt failed, retrying"
            sleep 8
          done
          solana balance
          solana program deploy target/deploy/hobita.so \
            --program-id keys/hobita-devnet.json \
            --keypair "$RUNNER_TEMP/deployer.json" \
            --url devnet
          solana program show "$(solana-keygen pubkey keys/hobita-devnet.json)" --url devnet
